name: Report an accessibility barrier
description: You can't do something because of how SightPress works with your assistive technology, keyboard, zoom or colour settings.
labels: ["accessibility", "bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Accessibility barriers are always treated as bugs. You never need to explain or prove a disability.
        Fields marked "(required)" must be filled in; the others are optional. Plain language and imperfect English
        are welcome.
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do? (required)
      description: For example "add a picture to a page" or "read the visits chart on the Analytics screen".
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened, or what was announced? (required)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect? (required)
    validations:
      required: true
  - type: input
    id: technology
    attributes:
      label: Assistive technology and its version (optional)
      description: For example "NVDA 2025.3", "VoiceOver on macOS 15", "ZoomText", "Dragon", "keyboard only", or "none".
  - type: input
    id: environment
    attributes:
      label: Browser and operating system (optional)
      description: For example "Firefox 140 on Windows 11".
  - type: input
    id: page
    attributes:
      label: Page or screen (optional)
      description: Its address or its heading, for example "/admin/pages" or "Edit About us".
  - type: input
    id: version
    attributes:
      label: SightPress version (optional)
