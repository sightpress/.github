name: Plugin QA

# Quality bar for official plugins and plugin-template. RELEASING.md §4.1.
# Dependencies come from Packagist, as they do for anyone who installs the
# plugin. Only the skeleton's integration job builds from sibling checkouts
# (composer.dev.json).

on:
  workflow_call:
    inputs:
      php-version:
        type: string
        default: '8.4'
      plugin-core-ref:
        description: Released plugin-core version to test against (for example v1.2.0). Empty means the newest one the constraint allows.
        type: string
        default: ''
      core-ref:
        description: Released core version to test against (for example v1.1.0). Empty means the newest one the constraint allows.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: intl, mbstring, sodium
          coverage: xdebug
          tools: composer:v2
      - run: composer validate --strict
      # A pinned version must already be on Packagist: the release workflow
      # waits for it before it notifies this repository. A version outside the
      # plugin's constraint fails here, because widening it needs a pull request
      # (RELEASING.md §6).
      - name: Install dependencies from Packagist
        env:
          PLUGIN_CORE_REF: ${{ inputs.plugin-core-ref }}
          CORE_REF: ${{ inputs.core-ref }}
        run: |
          with=()
          for pair in "sightpress/plugin-core=$PLUGIN_CORE_REF" "sightpress/core=$CORE_REF"; do
            package="${pair%%=*}"
            ref="${pair#*=}"
            [ -z "$ref" ] && continue
            version="${ref#v}"
            if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "::error::$package: \"$ref\" is not a released version. Give a tag such as v1.2.0, or leave it empty for the newest release."
              exit 1
            fi
            echo "Testing against $package $version."
            with+=(--with "$package:$version")
          done
          composer update --no-interaction --prefer-dist "${with[@]}"
          composer show 'sightpress/*'
      - run: composer audit
      - run: vendor/bin/sightpress-check-licenses
      - run: XDEBUG_MODE=coverage vendor/bin/phpunit --coverage-clover var/coverage/clover.xml
      - run: vendor/bin/sightpress-check-coverage var/coverage/clover.xml
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - run: vendor/bin/rector process --dry-run
      - run: vendor/bin/deptrac analyse --no-progress
      # Each repository's own script: a plugin checks the locales its manifest
      # requires (--manifest), the template checks the 11 launch locales.
      # Missing or empty targets fail every build. Targets still marked
      # needs-review-translation are a warning on ordinary pull requests and
      # fail the release pull request, so no release ships them
      # (RELEASING.md §7).
      - name: Translations
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" == release-please--* ]]; then
            echo "Release build: targets waiting for review block the release."
            composer check:translations -- --release
            exit 0
          fi
          set -o pipefail
          composer check:translations | tee "$RUNNER_TEMP/translations.txt"
          waiting=$(grep -oE 'needs-review-translation\): [0-9]+' "$RUNNER_TEMP/translations.txt" | grep -oE '[0-9]+$' || echo 0)
          if [ "${waiting:-0}" != "0" ]; then
            echo "::warning::$waiting translation targets are waiting for a fluent reviewer (needs-review-translation). The release pull request refuses them."
            echo "$waiting translation targets are waiting for review (needs-review-translation). The release pull request refuses them." >> "$GITHUB_STEP_SUMMARY"
          fi

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # Skips with a reason until SIGHTPRESS_BASE_URL points at a served site;
      # the skeleton's integration CI serves one with this plugin enabled.
      - run: npx playwright test

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # A repository's first pull request adds its first manifest, so the base
      # branch has no dependency graph to compare against yet. Every later
      # pull request is reviewed.
      - id: base
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$BASE:composer.json" 2>/dev/null || git cat-file -e "$BASE:package.json" 2>/dev/null; then
            echo "has-manifest=true" >> "$GITHUB_OUTPUT"
          else
            echo "The base branch has no composer.json or package.json yet, so there are no dependencies to compare. Dependency review runs on every later pull request." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.base.outputs.has-manifest == 'true'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
