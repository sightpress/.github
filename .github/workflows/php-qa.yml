name: PHP QA

# Quality bar for libraries and bundles (plugin-core, core). RELEASING.md §4.1.

on:
  workflow_call:
    inputs:
      php-version:
        type: string
        default: '8.4'
      composer-flags:
        description: Extra flags for composer update (for example --prefer-lowest).
        type: string
        default: ''

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # A repository with no code yet has nothing to check; say so in words.
      # Every check runs as soon as it has a composer.json.
      - id: code
        run: |
          if [ -f composer.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No composer.json in this repository yet, so there is no PHP to check." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.code.outputs.present == 'true'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: intl, mbstring, sodium
          coverage: xdebug
          tools: composer:v2
      - if: steps.code.outputs.present == 'true'
        run: composer validate --strict
      - if: steps.code.outputs.present == 'true'
        run: composer update --no-interaction --prefer-dist ${{ inputs.composer-flags }}
      - if: steps.code.outputs.present == 'true'
        run: composer audit
      - if: steps.code.outputs.present == 'true'
        run: composer check:licenses
      - if: steps.code.outputs.present == 'true'
        run: composer test:coverage
      - if: steps.code.outputs.present == 'true'
        run: vendor/bin/phpstan analyse --memory-limit=1G
      - if: steps.code.outputs.present == 'true'
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - if: steps.code.outputs.present == 'true'
        run: vendor/bin/rector process --dry-run
      - if: steps.code.outputs.present == 'true'
        run: vendor/bin/deptrac analyse --no-progress
      - if: steps.code.outputs.present == 'true'
        run: composer lint:twig
      # Optional gates: each runs when the repository defines its script (core does),
      # and says so in words when it doesn't.
      - if: steps.code.outputs.present == 'true'
        name: Performance budgets
        run: |
          if composer run-script --list 2>/dev/null | grep -qE '^ *check:budgets( |$)'; then
            composer check:budgets
          else
            echo "No check:budgets script in this repository, so there are no budgets to check." >> "$GITHUB_STEP_SUMMARY"
          fi
      # Missing or empty targets fail every build. Targets still marked
      # needs-review-translation are reported here as a warning and block only
      # release builds (RELEASING.md §7).
      - if: steps.code.outputs.present == 'true'
        name: Translations in the 11 launch locales
        run: |
          if ! composer run-script --list 2>/dev/null | grep -qE '^ *check:translations( |$)'; then
            echo "No check:translations script in this repository, so there are no catalogues to check." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set -o pipefail
          composer check:translations | tee "$RUNNER_TEMP/translations.txt"
          waiting=$(grep -oE 'needs-review-translation\): [0-9]+' "$RUNNER_TEMP/translations.txt" | grep -oE '[0-9]+$' || echo 0)
          if [ "${waiting:-0}" != "0" ]; then
            echo "::warning::$waiting translation targets are waiting for a fluent reviewer (needs-review-translation). A release build refuses them."
            echo "$waiting translation targets are waiting for review (needs-review-translation)." >> "$GITHUB_STEP_SUMMARY"
          fi

  # hashFiles() only works inside steps, so the job checks for package.json first.
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: js
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No package.json in this repository, so there is no JavaScript to check." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.js.outputs.present == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Browser tests in core run the admin on PHP's built-in server, and the
      # shared test kit and CSS rules come from vendor/sightpress/plugin-core.
      - if: steps.js.outputs.present == 'true' && hashFiles('composer.json') != ''
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: intl, mbstring, sodium
          coverage: none
          tools: composer:v2
      - if: steps.js.outputs.present == 'true' && hashFiles('composer.json') != ''
        run: composer install --no-interaction --prefer-dist --no-progress
      - if: steps.js.outputs.present == 'true'
        run: npm ci --no-audit --no-fund
      - if: steps.js.outputs.present == 'true'
        run: npm audit --audit-level=high
      - if: steps.js.outputs.present == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.js.outputs.present == 'true'
        run: npm run test:unit
      - if: steps.js.outputs.present == 'true'
        run: npm run typecheck
      - if: steps.js.outputs.present == 'true'
        run: npm run test:browser

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # A repository's first pull request adds its first manifest, so the base
      # branch has no dependency graph to compare against yet. Every later
      # pull request is reviewed.
      - id: base
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$BASE:composer.json" 2>/dev/null || git cat-file -e "$BASE:package.json" 2>/dev/null; then
            echo "has-manifest=true" >> "$GITHUB_OUTPUT"
          else
            echo "The base branch has no composer.json or package.json yet, so there are no dependencies to compare. Dependency review runs on every later pull request." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.base.outputs.has-manifest == 'true'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
