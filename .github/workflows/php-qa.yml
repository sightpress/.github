name: PHP QA

# Quality bar for libraries and bundles (plugin-core, core). RELEASING.md §4.1.

on:
  workflow_call:
    inputs:
      php-version:
        type: string
        default: '8.4'
      composer-flags:
        description: Extra flags for composer update (for example --prefer-lowest).
        type: string
        default: ''

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: intl, mbstring, sodium
          coverage: xdebug
          tools: composer:v2
      - run: composer validate --strict
      - run: composer update --no-interaction --prefer-dist ${{ inputs.composer-flags }}
      - run: composer audit
      - run: composer check:licenses
      - run: composer test:coverage
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - run: vendor/bin/rector process --dry-run
      - run: vendor/bin/deptrac analyse --no-progress
      - run: composer lint:twig

  # hashFiles() only works inside steps, so the job checks for package.json first.
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: js
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No package.json in this repository, so there is no JavaScript to check." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.js.outputs.present == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - if: steps.js.outputs.present == 'true'
        run: npm ci --no-audit --no-fund
      - if: steps.js.outputs.present == 'true'
        run: npm audit --audit-level=high
      - if: steps.js.outputs.present == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.js.outputs.present == 'true'
        run: npm run test:unit
      - if: steps.js.outputs.present == 'true'
        run: npm run typecheck
      - if: steps.js.outputs.present == 'true'
        run: npm run test:browser

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
